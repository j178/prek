name: "Sync pre-commit identify tags"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

env:
  UV_VERSION: "0.13.7"

jobs:
  sync:
    if: github.repository == 'j178/prek'
    runs-on: ubuntu-latest
    concurrency: sync-identify-tags
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: "Install Rustfmt"
        run: rustup component add rustfmt
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: "Sync identify tags"
        run: uv run --upgrade gen.py
        working-directory: ./crates/prek-identify

      - name: "Create Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: sync-identify-tags
          PR_TITLE: Sync latest identify tags
          PR_BODY: "Automated update for identify tags."
        run: |
          git add -- crates/prek-identify/src/tags.rs crates/prek-identify/gen.py.lock
          scripts/update-pr.sh --draft
