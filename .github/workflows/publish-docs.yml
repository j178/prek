name: Deploy Documentation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The commit SHA, tag, or branch to publish. Uses the default branch if not specified."
        default: ""
        type: string
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions: {}

env:
  UV_VERSION: "0.12.5"

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Resolve documentation version
        id: docs
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="dev"
          else
            version="$(uv version --short)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build versioned documentation
        env:
          VERSION: ${{ steps.docs.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$VERSION" == "dev" ]]; then
            uv run --group docs mike deploy "$VERSION"
          else
            # GitHub Pages artifacts cannot contain symbolic links.
            uv run --group docs mike deploy --update-aliases --alias-type redirect "$VERSION" latest
            uv run --group docs mike set-default latest
          fi

      - name: Push versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin gh-pages

      - name: Prepare Pages artifact
        run: |
          git worktree add published gh-pages
          # Keep existing unversioned URLs serving the latest release, or dev
          # before the first release is published.
          root_version="$(uv run --group docs python -c 'import json; versions = json.load(open("published/versions.json")); print(next((item["version"] for item in versions if "latest" in item["aliases"]), "dev"))')"
          cp -a "published/$root_version/." published/
          uv run --group docs llmstxt-standalone build --site-dir published --output-dir published

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true
          path: ./published

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
