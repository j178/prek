name: "Update prek hooks"

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 00:00 UTC.
    - cron: "0 0 * * 1"

permissions: {}

jobs:
  update:
    if: github.repository == 'j178/prek'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@v3.1.0
        with:
          install-only: true

      - name: "Update hooks"
        run: prek update

      - name: "Create Pull Request"
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "Update prek hooks"
          add-paths: prek.toml
          branch: "update-prek-hooks"
          title: "Update prek hooks"
          body: "Automated update generated by `prek update`."
          base: "main"
          labels: "internal"
