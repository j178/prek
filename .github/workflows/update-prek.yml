name: "Update prek hooks"

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 00:00 UTC.
    - cron: "0 0 * * 1"

permissions: {}

jobs:
  update:
    if: github.repository == 'j178/prek'
    runs-on: ubuntu-latest
    concurrency: update-prek-hooks
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true

      - name: "Update hooks"
        run: prek update

      - name: "Create Pull Request"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: update-prek-hooks
          PR_TITLE: Update prek hooks
          PR_BODY: "Automated update generated by `prek update`."
        run: |
          git add -- prek.toml
          scripts/update-pr.sh --label internal
