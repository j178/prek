name: "Update prek hooks"

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 00:00 UTC.
    - cron: "0 0 * * 1"

permissions: {}

jobs:
  update:
    if: github.repository == 'j178/prek'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          install-only: true

      - name: "Update hooks"
        run: prek update

      - name: "Create Pull Request"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Update prek hooks"
          add-paths: prek.toml
          branch: "update-prek-hooks"
          title: "Update prek hooks"
          body: "Automated update generated by `prek update`."
          base: "master"
          labels: "internal"
