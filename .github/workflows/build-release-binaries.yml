# Build prek on all platforms.
#
# Generates both wheels (for PyPI) and archived binaries (for GitHub releases).
# Assumed to run as a subworkflow of .github/workflows/release.yml; specifically, as a local
# artifacts job within `cargo-dist`.
#
# Adapted from https://github.com/astral-sh/uv/blob/main/.github/workflows/build-release-binaries.yml

name: "Build release binaries"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      variant:
        description: "Build only native evaluation artifacts: baseline or pgo"
        type: string
        default: ""

permissions: {}

env:
  ACTIONS_CACHE_MODE: none
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  # renovate: datasource=github-releases depName=PyO3/maturin versioning=semver
  MATURIN_VERSION: "v1.15.0"

jobs:
  sdist:
    if: ${{ inputs.variant == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - name: "Upload sdist"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  native:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: "2_17"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: "2_28"
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      TARGET: ${{ matrix.platform.target }}
      # Enable each target only after its independent PGO evaluation passes.
      PGO_ENABLED: ${{ inputs.variant == 'pgo' || (inputs.variant == '' && contains(fromJSON(vars.PREK_RELEASE_PGO_TARGETS || '[]'), matrix.platform.target)) }}
      # Match the deployment target in the training and final macOS builds.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.target == 'aarch64-apple-darwin' && '11.0' || matrix.platform.target == 'x86_64-apple-darwin' && '10.12' || '' }}
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make Git Bash available to Python
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$(cygpath -w /usr/bin)" >> "$GITHUB_PATH"
      - name: Install NASM
        if: ${{ matrix.platform.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          winget install NASM.NASM --accept-source-agreements --accept-package-agreements
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Use LLD on Windows ARM64
        # link.exe can corrupt ARM64 PGO profiles; use the same linker for baseline builds.
        # https://github.com/rust-lang/rust/issues/156675
        if: matrix.platform.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          linker="$(cygpath -m "$(rustc --print sysroot)")/lib/rustlib/$TARGET/bin/rust-lld.exe"
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-Clinker=$linker -Clinker-flavor=lld-link" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: ${{ env.PGO_ENABLED == 'true' && runner.os != 'Linux' }}
        with:
          enable-cache: false
      - name: Train PGO on macOS and Windows
        # Linux trains inside manylinux so both builds use the same toolchain and libraries.
        if: ${{ env.PGO_ENABLED == 'true' && runner.os != 'Linux' }}
        shell: bash
        run: |
          uv run --no-project --python '>=3.9' scripts/pgo/train.py --target "$TARGET"
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-Cprofile-use=$GITHUB_WORKSPACE/target/pgo/$TARGET/prek.profdata" >> "$GITHUB_ENV"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ env.TARGET }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --locked --out dist --features self-update --compatibility pypi
          before-script-linux: |
            if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then
              # GNU ld can fail on large instrumented binaries; use lld for both builds.
              lld_dir="$(rustc --print sysroot)/lib/rustlib/$TARGET/bin/gcc-ld"
              export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Clink-arg=-B$lld_dir -Clink-arg=-fuse-ld=lld"
            fi
            if [ "$PGO_ENABLED" = true ]; then
              uv run --no-project --python '>=3.9' scripts/pgo/train.py --target "$TARGET"
              export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Cprofile-use=$PWD/target/pgo/$TARGET/prek.profdata"
            fi
          docker-options: -e PGO_ENABLED -e TARGET
      - name: Smoke-test release binary
        shell: bash
        run: python scripts/pgo/train.py --verify "target/$TARGET/release/prek${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Archive binary
        shell: python
        run: |
          import hashlib
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          target = os.environ["TARGET"]
          binary = Path("target", target, "release", "prek.exe" if os.name == "nt" else "prek")
          if os.name == "nt":
              archive = Path(f"prek-{target}.zip")
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as output:
                  output.write(binary, "prek.exe")
          else:
              archive = Path(f"prek-{target}.tar.gz")
              with tarfile.open(archive, "w:gz") as output:
                  output.add(binary, arcname=f"prek-{target}/prek")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(f"{archive}.sha256").write_text(f"{digest}  {archive.name}\n")
      - name: Upload wheel
        if: ${{ inputs.variant == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ env.TARGET }}
          path: dist
          if-no-files-found: error
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.variant && format('{0}-', inputs.variant) || '' }}artifacts-${{ env.TARGET }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  linux-ppc64le:
    if: ${{ inputs.variant == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET: powerpc64le-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ env.TARGET }}
          manylinux: 2_17
          args: --release --locked --out dist --features self-update --compatibility pypi
      - name: "Upload wheels"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ env.TARGET }}
          path: dist
      - name: "Archive binary"
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_NAME="prek-$TARGET"
          ARCHIVE_FILE="$ARCHIVE_NAME.tar.gz"

          mkdir -p "$ARCHIVE_NAME"
          cp "target/$TARGET/release/prek" "$ARCHIVE_NAME/prek"
          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"
      - name: "Upload binary"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ env.TARGET }}
          path: |
            *.tar.gz
            *.sha256

  musllinux:
    if: ${{ inputs.variant == '' }}
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ env.TARGET }}
          manylinux: musllinux_1_1
          args: --release --locked --out dist --features self-update --compatibility pypi
      - name: "Upload wheels"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ env.TARGET }}
          path: dist
      - name: "Archive binary"
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_NAME="prek-$TARGET"
          ARCHIVE_FILE="$ARCHIVE_NAME.tar.gz"

          mkdir -p "$ARCHIVE_NAME"
          cp "target/$TARGET/release/prek" "$ARCHIVE_NAME/prek"
          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"
      - name: "Upload binary"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ env.TARGET }}
          path: |
            *.tar.gz
            *.sha256

  musllinux-cross:
    if: ${{ inputs.variant == '' }}
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ env.TARGET }}
          manylinux: musllinux_1_1
          # Also support glibc systems older than the aarch64 GNU build's baseline.
          args: --release --locked --out dist --features self-update --compatibility 2_17 --compatibility pypi
      - name: "Upload wheels"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ env.TARGET }}
          path: dist
      - name: "Archive binary"
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_NAME="prek-$TARGET"
          ARCHIVE_FILE="$ARCHIVE_NAME.tar.gz"

          mkdir -p "$ARCHIVE_NAME"
          cp "target/$TARGET/release/prek" "$ARCHIVE_NAME/prek"
          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"
      - name: "Upload binary"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ env.TARGET }}
          path: |
            *.tar.gz
            *.sha256
