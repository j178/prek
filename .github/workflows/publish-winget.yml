name: "Publish to winget"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish (e.g., vX.Y.Z)."
        required: true
        type: string
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: true

permissions: {}

env:
  ACTIONS_CACHE_MODE: none

jobs:
  winget:
    name: Publish to winget
    runs-on: ubuntu-latest
    environment:
      name: release
    if: >-
      ${{
        inputs.plan == ''
        || !fromJson(inputs.plan).announcement_is_prerelease
      }}
    steps:
      - name: Determine release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PLAN_TAG: ${{ inputs.plan != '' && fromJson(inputs.plan).announcement_tag || '' }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=$PLAN_TAG" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Install komac
        env:
          KOMAC_VERSION: "v2.16.0"
          KOMAC_SHA256: "7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d"
        shell: bash
        run: |
          archive="$RUNNER_TEMP/komac.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/russellbanks/Komac/releases/download/${KOMAC_VERSION}/komac-${KOMAC_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "$KOMAC_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/komac"
          tar -xzf "$archive" -C "$RUNNER_TEMP/komac" komac
          echo "$RUNNER_TEMP/komac" >> "$GITHUB_PATH"

      - name: Publish to winget
        env:
          # gh prefers GH_TOKEN; komac reads GITHUB_TOKEN to write to the WinGet fork.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: prek-bot
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          version=$(jq -er '.tag_name | ltrimstr("v")' <<< "$release")
          mapfile -t urls < <(jq -r '.assets[] | select(.name | test("^prek-.*windows.*\\.zip$")) | .browser_download_url' <<< "$release")
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::error::No Windows installer archives found for $RELEASE_TAG"
            exit 1
          fi
          komac sync
          komac update j178.Prek --version "$version" --submit --urls "${urls[@]}"
          komac cleanup --only-merged
