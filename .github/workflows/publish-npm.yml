name: "Publish to npmjs registry"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  UV_VERSION: "0.12.5"

jobs:
  publish:
    name: Upload to npmjs registry
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      # For npm's trusted publishing.
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: npm-artifacts/
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build npm packages
        run: |
          printf '%s' "$PLAN" > plan-dist-manifest.json
          uv run ./scripts/build-npm-packages.py --plan plan-dist-manifest.json --artifacts-dir ./npm-artifacts --out-dir ./npm/.output
      - name: Publish npm packages
        run: |
          prerelease=$(echo "$PLAN" | jq --raw-output '.announcement_is_prerelease')
          jq --raw-output '.publishOrder[]' ./npm/.output/manifest.json | while IFS= read -r pkg; do
            if [ "$prerelease" = "true" ]; then
              npm publish --tag beta --provenance --access public "$pkg"
            else
              npm publish --provenance --access public "$pkg"
            fi
          done
