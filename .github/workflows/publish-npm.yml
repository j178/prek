name: "Publish to npmjs registry"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  ACTIONS_CACHE_MODE: none
  UV_VERSION: "0.13.4"

jobs:
  publish:
    name: Upload to npmjs registry
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      # For npm's trusted publishing.
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch binary archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: npm-artifacts/
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: ""
          package-manager-cache: false
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
      - name: Build npm packages
        run: |
          printf '%s' "$PLAN" > plan-dist-manifest.json
          uv run ./scripts/build-npm-packages.py --plan plan-dist-manifest.json --artifacts-dir ./npm-artifacts --out-dir ./npm/.output
      - name: Publish npm packages
        run: |
          prerelease=$(echo "$PLAN" | jq --raw-output '.announcement_is_prerelease')
          jq --raw-output '.publishOrder[]' ./npm/.output/manifest.json | while IFS= read -r pkg; do
            if [ "$prerelease" = "true" ]; then
              npm publish --tag beta --provenance --access public "$pkg"
            else
              npm publish --provenance --access public "$pkg"
            fi
          done
