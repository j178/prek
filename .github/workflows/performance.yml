name: Performance

on:
  workflow_call:
    inputs:
      save-rust-cache:
        required: false
        type: string
        default: "true"

permissions: {}

env:
  # Cargo env vars
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bloat-check:
    runs-on: ubuntu-latest
    name: "bloat check"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "Install mold"
        run: ./scripts/install-mold.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-bloat

      - name: Build head branch
        id: bloat_head
        shell: bash
        run: |
          cargo bloat --locked --profile profiling -p prek --bin prek --features self-update --message-format json -n 0 > bloat_head.json

      - name: Checkout base
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}

      - name: Build base branch
        id: bloat_base
        shell: bash
        run: |
          cargo bloat --locked --profile profiling -p prek --bin prek --features self-update --message-format json -n 0 > bloat_base.json

      - name: Compare bloat results
        shell: python
        run: |
          import json
          from collections import Counter
          from html import escape
          from pathlib import Path

          base = json.loads(Path("bloat_base.json").read_text())
          head = json.loads(Path("bloat_head.json").read_text())

          def symbol_sizes(report):
              sizes = Counter()
              # Multiple symbols can share a demangled name, especially async functions.
              for symbol in report["functions"]:
                  sizes[symbol["name"]] += symbol["size"]
              return sizes

          base_symbols = symbol_sizes(base)
          head_symbols = symbol_sizes(head)
          changes = [
              {
                  "name": name,
                  "base": base_symbols[name],
                  "head": head_symbols[name],
                  "delta": head_symbols[name] - base_symbols[name],
              }
              for name in base_symbols.keys() | head_symbols.keys()
              if base_symbols[name] != head_symbols[name]
          ]
          changes.sort(key=lambda change: (-abs(change["delta"]), change["name"]))
          Path("bloat-diff.json").write_text(json.dumps(changes, indent=2) + "\n")

          lines = [
              "### 📦 Cargo Bloat Comparison",
              "",
              "Build: `profiling` + `self-update` (with debug info).",
              "",
              "| Metric | Base (bytes) | Head (bytes) | Change |",
              "| --- | ---: | ---: | ---: |",
          ]
          for label, key in [("`.text`", "text-section-size"), ("File", "file-size")]:
              before, after = base[key], head[key]
              delta = after - before
              percent = delta / before * 100
              lines.append(f"| {label} | {before:,} | {after:,} | {delta:+,} ({percent:+.2f}%) |")

          lines.extend([
              "",
              "<details>",
              "<summary>Largest symbol changes</summary>",
          ])
          increases = [change for change in changes if change["delta"] > 0]
          decreases = [change for change in changes if change["delta"] < 0]
          for title, symbols in [("Increases", increases), ("Decreases", decreases)]:
              lines.extend(["", f"#### {title}", ""])
              if not symbols:
                  lines.append("None.")
                  continue
              lines.extend([
                  "| Symbol | Base (bytes) | Head (bytes) | Change (bytes) |",
                  "| --- | ---: | ---: | ---: |",
              ])
              for symbol in symbols[:10]:
                  name = symbol["name"]
                  if len(name) > 240:
                      name = name[:240] + "…"
                  name = escape(name).replace("|", "&#124;").replace("\n", " ")
                  lines.append(
                      f"| <code>{name}</code> | {symbol['base']:,} | {symbol['head']:,} | {symbol['delta']:+,} |"
                  )
          lines.extend([
              "",
              "</details>",
          ])
          Path("bloat-comparison.txt").write_text("\n".join(lines) + "\n")

      - name: Upload bloat results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # NOTE: https://github.com/j178/prek-ci-bot uses this artifact name to post comments on PRs.
          # Make sure to update the bot if you rename the artifact.
          name: bloat-check-results
          path: |
            bloat-comparison.txt
            bloat_base.json
            bloat_head.json
            bloat-diff.json

  hyperfine-benchmark:
    runs-on: ubuntu-latest
    name: "hyperfine benchmark"
    timeout-minutes: 10
    env:
      HYPERFINE_BENCHMARK_WORKSPACE: /tmp/prek-bench
      HYPERFINE_BIN_DIR: ${{ github.workspace }}/.hyperfine-bin
      HYPERFINE_RESULTS_FILE: ${{ github.workspace }}/hyperfine-benchmark.md
      HYPERFINE_HEAD_BINARY: prek-head
      HYPERFINE_BASE_BINARY: prek-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Add hyperfine bin dir to PATH
        run: |
          mkdir -p "$HYPERFINE_BIN_DIR"
          echo "$HYPERFINE_BIN_DIR" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - id: base-binary-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HYPERFINE_BIN_DIR }}/${{ env.HYPERFINE_BASE_BINARY }}
          key: prek-hyperfine-base-${{ github.event.pull_request.base.sha }}-${{ hashFiles('Cargo.lock') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build base version
        if: ${{ steps.base-binary-cache.outputs.cache-hit != 'true' }}
        env:
          BASE_VERSION: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          cargo build --profile profiling && mv target/profiling/prek "$HYPERFINE_BIN_DIR/$HYPERFINE_BASE_BINARY"
          git checkout ${{ github.sha }}

      - name: Build head version
        run: |
          cargo build --profile profiling && mv target/profiling/prek "$HYPERFINE_BIN_DIR/$HYPERFINE_HEAD_BINARY"

      - name: Install hyperfine
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: hyperfine

      - name: Setup test environment for builtin hooks
        run: scripts/hyperfine-setup-test-env.sh

      - name: Run benchmarks
        run: scripts/hyperfine-run-benchmarks.sh

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # NOTE: https://github.com/j178/prek-ci-bot uses this artifact name to post comments on PRs.
          # Make sure to update the bot if you rename the artifact.
          name: hyperfine-benchmark-results
          path: ${{ env.HYPERFINE_RESULTS_FILE }}
