name: "Publish prek-action known versions"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
    secrets:
      PREK_ACTION_TOKEN:
        required: true

permissions: {}

env:
  ACTIONS_CACHE_MODE: none

jobs:
  publish:
    name: Publish prek-action known versions
    runs-on: ubuntu-latest
    concurrency: publish-prek-action-known-versions
    permissions:
      contents: read
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: j178/prek-action
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PREK_ACTION_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: ""
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Update known versions
        id: refresh
        env:
          GITHUB_TOKEN: ${{ secrets.PREK_ACTION_TOKEN }}
        run: |
          # Wait a bit to ensure the new release is available via the GitHub API.
          sleep 10
          npm run update-known-versions

      - name: Check whether known version files changed
        id: changes
        run: |
          if git diff --quiet -- version-manifest.json src/known-checksums.ts; then
            echo "known_versions_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "known_versions_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.changes.outputs.known_versions_changed == 'true'
        run: npm test

      - name: Rebuild dist
        if: steps.changes.outputs.known_versions_changed == 'true'
        run: npm run bundle

      - name: Check out the prek workflow script
        if: steps.changes.outputs.known_versions_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: prek
          sparse-checkout: scripts
          persist-credentials: false

      - name: Create pull request
        id: pr
        if: steps.changes.outputs.known_versions_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PREK_ACTION_TOKEN }}
          GH_REPO: j178/prek-action
          PR_BRANCH: automation/update-known-versions
          PR_TITLE: ${{ steps.refresh.outputs.pr_title }}
          PR_BODY: |
            Automated update from the prek release workflow.

            Added releases:
            ${{ steps.refresh.outputs.added_versions_markdown }}
        run: |
          git add -- version-manifest.json src/known-checksums.ts dist/index.cjs
          prek/scripts/update-pr.sh

      - name: Merge pull request
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.PREK_ACTION_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          sleep 10
          gh pr merge --squash "$PR_URL"
