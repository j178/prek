name: "Publish to crates.io"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  ACTIONS_CACHE_MODE: none

jobs:
  publish:
    name: Upload to crates.io
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      # For crates.io's trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: "Install mold"
        run: ./scripts/install-mold.sh

      - name: "Install Rust toolchain"
        run: rustup show
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - name: "Publish to crates.io"
        run: python3 scripts/publish-packages.py crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
