name: Evaluate PGO

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, pgo]
    uses: $/.github/workflows/build-release-binaries.yml
    with:
      plan: ""
      variant: ${{ matrix.variant }}

  benchmark:
    needs: build
    # A failed target must not prevent measuring the other completed pairs.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
        repetition: [1, 2, 3]
    env:
      TARGET: ${{ matrix.platform.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make Git Bash available to Python
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$(cygpath -w /usr/bin)" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-artifacts-${{ env.TARGET }}
          path: baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pgo-artifacts-${{ env.TARGET }}
          path: pgo
      - name: Install hyperfine
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: hyperfine
      - name: Compare release binaries
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          import sys

          target = os.environ["TARGET"]
          extension = "zip" if os.name == "nt" else "tar.gz"
          binary = "prek.exe" if os.name == "nt" else f"prek-{target}/prek"
          for variant in ("baseline", "pgo"):
              shutil.unpack_archive(f"{variant}/prek-{target}.{extension}", variant)
          subprocess.run([
              sys.executable, "scripts/pgo/benchmark.py",
              "--baseline", f"baseline/{binary}",
              "--pgo", f"pgo/{binary}",
              "--output", "results.json",
          ], check=True)
      - name: Summarize measurements
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          results = json.loads(Path("results.json").read_text())
          lines = [f"## {os.environ['TARGET']}", "", "| Workload | Baseline (ms) | PGO (ms) | Change |", "| --- | ---: | ---: | ---: |"]
          for name, case in results["cases"].items():
              baseline, pgo = case["median_seconds"]
              change = (case["pgo_over_baseline"] - 1) * 100
              lines.append(f"| {name} | {baseline * 1000:.2f} | {pgo * 1000:.2f} | {change:+.2f}% |")
          lines.append(f"\nGeometric mean ratio: {results['geometric_mean_ratio']:.4f}")
          baseline_size, pgo_size = [binary["bytes"] for binary in results["binaries"]]
          size_change = results["binary_size_change"]
          lines.extend([
              "",
              "| Baseline size (bytes) | PGO size (bytes) | Difference (bytes) | Change |",
              "| ---: | ---: | ---: | ---: |",
              f"| {baseline_size:,} | {pgo_size:,} | {size_change['bytes']:+,} | {size_change['percent']:+.2f}% |",
              "",
              "Size changes are PGO minus baseline; negative values mean a smaller binary.",
          ])
          lines.append("\nReview all three runs, raw samples, binary sizes, and build costs before enabling release PGO.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pgo-results-${{ env.TARGET }}-${{ matrix.repetition }}
          path: results.json
          if-no-files-found: error
