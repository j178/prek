<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">Median end-to-end runtime for each benchmark stage</title>
  <desc id="desc">Horizontal bars compare pre-commit at 1942 milliseconds, prek without the fast path at 1534 milliseconds, prek with the fast path at 105 milliseconds, prek with priority scheduling at 94 milliseconds, and prek with two projects at 80 milliseconds. Lower is better.</desc>
  <style>
    text {
      fill: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 20px; font-weight: 600; }
    .subtitle, .tick, .note { fill: #475569; }
    .subtitle { font-size: 13px; }
    .label { font-size: 14px; font-weight: 600; }
    .value { font-size: 13px; }
    .tick, .note { font-size: 12px; }
    .grid { stroke: #cbd5e1; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1; }
    .reference { fill: #94a3b8; }
    .baseline { fill: #64748b; }
    .optimized { fill: #6366f1; }
    .final { fill: #4338ca; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .subtitle, .tick, .note { fill: #a8b3cf; }
      .grid { stroke: #334155; }
      .axis { stroke: #64748b; }
      .reference { fill: #94a3b8; }
      .baseline { fill: #64748b; }
      .optimized { fill: #818cf8; }
      .final { fill: #a5b4fc; }
    }
  </style>

  <text class="title" x="20" y="28">Runtime optimization ladder</text>
  <text class="subtitle" x="20" y="51">Median wall time in milliseconds; lower is better</text>

  <line class="grid" x1="250" y1="72" x2="250" y2="402" />
  <line class="grid" x1="390" y1="72" x2="390" y2="402" />
  <line class="grid" x1="530" y1="72" x2="530" y2="402" />
  <line class="grid" x1="670" y1="72" x2="670" y2="402" />
  <line class="grid" x1="810" y1="72" x2="810" y2="402" />
  <line class="axis" x1="250" y1="402" x2="810" y2="402" />

  <text class="label" x="20" y="106">pre-commit</text>
  <rect class="reference" x="250" y="83" width="340" height="32" rx="4" />
  <text class="value" x="602" y="105">1,942 ms · reference</text>

  <text class="label" x="20" y="171">prek: no fast path</text>
  <rect class="baseline" x="250" y="148" width="268" height="32" rx="4" />
  <text class="value" x="530" y="170">1,534 ms · baseline</text>

  <text class="label" x="20" y="236">prek: fast path</text>
  <rect class="optimized" x="250" y="213" width="18" height="32" rx="4" />
  <text class="value" x="280" y="235">105 ms · 93% lower than previous</text>

  <text class="label" x="20" y="301">prek: + priority</text>
  <rect class="optimized" x="250" y="278" width="16" height="32" rx="4" />
  <text class="value" x="278" y="300">94 ms · 11% lower</text>

  <text class="label" x="20" y="366">prek: + 2 projects</text>
  <rect class="final" x="250" y="343" width="14" height="32" rx="4" />
  <text class="value" x="276" y="365">80 ms · 15% lower</text>

  <text class="tick" x="250" y="423" text-anchor="middle">0</text>
  <text class="tick" x="390" y="423" text-anchor="middle">800</text>
  <text class="tick" x="530" y="423" text-anchor="middle">1,600</text>
  <text class="tick" x="670" y="423" text-anchor="middle">2,400</text>
  <text class="tick" x="810" y="423" text-anchor="middle">3,200 ms</text>
  <text class="note" x="20" y="454">Pooled median of 30 runs (forward and reverse command order)</text>
</svg>
